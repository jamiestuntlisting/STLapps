<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every StuntListing app in one place — your dashboard, the rate calculator, contracts, Action Vault, flashcards, the arcade and the rest.">
<meta name="theme-color" content="#0a0b0d">

<!-- Added to a phone's home screen this opens full-screen, no browser chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StuntListing">

<title>StuntListing Apps</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230a0b0d'/%3E%3Cpath d='M20 44 32 16l12 28' fill='none' stroke='%23ff5a36' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip" href="#apps">Skip to apps</a>

<header class="topbar">
  <div class="rail">
    <a class="brand" href="./" aria-label="StuntListing Apps — home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M9 23 16 8l7 15" fill="none" stroke="currentColor"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">
        <b>StuntListing</b>
        <span>Apps</span>
      </span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input type="search" id="search" placeholder="Search apps" autocomplete="off"
             autocorrect="off" spellcheck="false" aria-label="Search apps"
             aria-controls="apps">
      <kbd aria-hidden="true">/</kbd>
    </div>
  </div>
</header>

<main>
  <!-- The launcher. Sections and cards are built from apps.js. -->
  <div id="apps" class="board" aria-live="polite"></div>

  <p class="empty" id="empty" hidden>No app matches that.</p>

  <!-- Settings. Opened by its own card; replaces the board. -->
  <section class="settings" id="settings" hidden aria-labelledby="settings-heading">
    <div class="settings-head">
      <button type="button" class="back" id="settings-back">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
        All apps
      </button>
      <h1 id="settings-heading">Settings</h1>
    </div>

    <div class="field">
      <label for="username">Your StuntListing username</label>
      <p class="field-hint">
        Profiles live at <code>stuntlisting.com/<em>username</em></code>. Set yours and the
        Profile card goes straight to your page.
      </p>
      <input type="text" id="username" placeholder="e.g. rosa" autocomplete="off"
             autocapitalize="none" spellcheck="false">
      <p class="field-note" id="username-preview"></p>
    </div>

    <div class="field">
      <span class="field-label" id="visible-label">Apps on the board</span>
      <p class="field-hint">Turn off anything you never open. Nothing is deleted.</p>
      <ul class="toggles" id="toggles" aria-labelledby="visible-label"></ul>
    </div>

    <div class="settings-foot">
      <button type="button" class="reset" id="reset">Reset to defaults</button>
      <span class="saved" id="saved" role="status"></span>
    </div>
  </section>
</main>

<footer class="footer">
  <span id="stamp" class="stamp"></span>
  <span>Edit <code>public/js/apps.js</code> to change what's here.</span>
</footer>

<noscript>
  <p class="empty">This launcher builds its cards with JavaScript. Turn it on, or go
  straight to <a href="https://www.stuntlisting.com">stuntlisting.com</a>.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#e8331d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#ground)"/>

  <!-- Four icons in a grid: the home screen, reduced to its bones. -->
  <g fill="url(#tile)">
    <rect x="112" y="112" width="126" height="126" rx="36"/>
    <rect x="274" y="112" width="126" height="126" rx="36"/>
    <rect x="112" y="274" width="126" height="126" rx="36"/>
  </g>
  <rect x="274" y="274" width="126" height="126" rx="36" fill="#ffffff" opacity=".22"/>
</svg>

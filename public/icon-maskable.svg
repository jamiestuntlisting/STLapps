<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#e8331d"/>
    </linearGradient>
  </defs>

  <!-- Maskable: art stays inside the middle 80%, so no corner gets clipped. -->
  <rect width="512" height="512" fill="#0b0d12"/>

  <g fill="url(#tile)">
    <rect x="146" y="146" width="98" height="98" rx="28"/>
    <rect x="268" y="146" width="98" height="98" rx="28"/>
    <rect x="146" y="268" width="98" height="98" rx="28"/>
  </g>
  <rect x="268" y="268" width="98" height="98" rx="28" fill="#ffffff" opacity=".22"/>
</svg>
